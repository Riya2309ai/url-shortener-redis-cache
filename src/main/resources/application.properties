spring.application.name=urlshortner
server.port=8080

# Used to build the shortUrl in responses
app.base-url=http://localhost:8080

#Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/urlshortner_db

spring.datasource.username=root
spring.datasource.password=root

# Hibernate only checks the schema, it never changes it
spring.jpa.hibernate.ddl-auto=validate

server.error.include-message=always
server.error.include-exception=true